<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NIM quickstart</title>
    <style>
      body { font: 15px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; margin: 2rem auto; max-width: 52rem; padding: 0 1rem; }
      textarea { width: 100%; height: 5rem; font: inherit; padding: .5rem; }
      button { font: inherit; padding: .4rem 1rem; margin-top: .5rem; }
      #out { white-space: pre-wrap; border: 1px solid #ccc; padding: 1rem; min-height: 8rem; margin-top: 1rem; }
      #stats { color: #555; margin-top: .5rem; }
    </style>
  </head>
  <body>
    <h1>NIM quickstart</h1>
    <p>No API key here — the browser talks to our FastAPI route, which holds the NGC key server-side.</p>
    <textarea id="prompt">Explain what a NIM is in two sentences.</textarea>
    <button id="go">Stream</button>
    <div id="out"></div>
    <div id="stats"></div>

    <script>
      const out = document.getElementById("out");
      const stats = document.getElementById("stats");
      const go = document.getElementById("go");

      go.addEventListener("click", async () => {
        out.textContent = "";
        stats.textContent = "";
        go.disabled = true;

        const started = performance.now();
        let ttft = null;

        try {
          const res = await fetch("/chat/stream", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              messages: [{ role: "user", content: document.getElementById("prompt").value }],
              max_tokens: 256,
            }),
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);

          const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
          let buffer = "";

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += value;

            // SSE frames are separated by a blank line.
            const frames = buffer.split("\n\n");
            buffer = frames.pop();

            for (const frame of frames) {
              const line = frame.split("\n").find((l) => l.startsWith("data: "));
              if (!line) continue;
              const data = line.slice(6);
              if (data === "[DONE]") continue;

              const event = JSON.parse(data);
              if (event.type === "token") {
                if (ttft === null) ttft = performance.now() - started;
                out.textContent += event.text;
              } else if (event.type === "reasoning") {
                // Reasoning models emit hidden thinking first — don't render it,
                // but prove the connection is alive.
                stats.textContent = "thinking…";
              } else if (event.type === "done") {
                const wall = Math.round(performance.now() - started);
                stats.textContent =
                  `TTFT (browser): ${Math.round(ttft ?? 0)} ms · ` +
                  `TTFT (server): ${event.ttft_ms} ms · ` +
                  `first byte: ${event.first_byte_ms} ms · ` +
                  `total: ${wall} ms · chunks: ${event.chunks}`;
              } else if (event.type === "error") {
                stats.textContent = `error: ${event.message}`;
              }
            }
          }
        } catch (err) {
          stats.textContent = `error: ${err.message}`;
        } finally {
          go.disabled = false;
        }
      });
    </script>
  </body>
</html>
